<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resultado</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/global.css') }}">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>

<body class="page-result"
      {% if erro %}data-toast-type="error" data-toast-message="Erro ao importar a planilha."
      {% elif importado %}data-toast-type="success" data-toast-message="Importação concluída com sucesso."{% endif %}>

<div class="box">

    <div class="navigation navigation-start">
        <a href="/importar">
            <button class="btn-auto-width"><i data-lucide="arrow-left"></i> Voltar</button>
        </a>
    </div>

    <h2 class="titulo">📊 Resultado do Processamento</h2>

    {% if erro %}
        <p class="ok error-message">{{ erro }}</p>
    {% elif usuarios %}
        <p><strong>🚨 Usuários para bloquear hoje:</strong></p>

        <ul>
            {% for u in usuarios %}
                <li>{{ u }}</li>
            {% endfor %}
        </ul>
    {% else %}
        <p class="ok">✅ Nenhum usuário para bloquear hoje</p>
    {% endif %}

    <div class="navigation">
        <a href="/importar">
            <button><i data-lucide="arrow-left"></i> Voltar</button>
        </a>
    </div>

    <a href="/historico">
        <button class="btn-history"><i data-lucide="history"></i> Ver Histórico</button>
    </a>

</div>

<script src="{{ url_for('static', filename='js/global.js') }}"></script>
<script>if(typeof lucide!=="undefined")lucide.createIcons();</script>
</body>
</html>
