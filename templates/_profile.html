<details class="profile-menu">
    <summary class="profile" title="{{ current_user.nome }} · {{ current_user.perfil|upper }}" aria-label="Abrir menu do usuário">
        <span class="profile-avatar">{{ current_user.iniciais }}</span>
        <span class="profile-copy"><small>{{ {'admin':'Administrador','rh':'Recursos Humanos','gestor':'Gestor','consulta':'Consulta'}.get(current_user.perfil, current_user.perfil) }}</small><strong>{{ current_user.nome }}</strong></span>
        <i class="profile-chevron" data-lucide="chevron-down"></i>
    </summary>
    <div class="profile-dropdown">
        <a href="{{ url_for('auth.minha_conta') }}"><i data-lucide="user-round"></i><span><strong>Minha conta</strong><small>Perfil e segurança</small></span></a>
        <form action="{{ url_for('auth.logout') }}" method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button type="submit"><i data-lucide="log-out"></i><span>Sair</span></button>
        </form>
    </div>
</details>
